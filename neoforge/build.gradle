plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}
dependencies {
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation "io.grpc:grpc-netty-shaded:${grpc_version}"
}

// Jar-in-Jar 不传递解析依赖，运行库必须逐项列出
def rpcLibraries = [
    'io.grpc:grpc-api': grpc_version,
    'io.grpc:grpc-context': grpc_version,
    'io.grpc:grpc-core': grpc_version,
    'io.grpc:grpc-util': grpc_version,
    'io.grpc:grpc-stub': grpc_version,
    'io.grpc:grpc-protobuf': grpc_version,
    'io.grpc:grpc-protobuf-lite': grpc_version,
    'io.grpc:grpc-netty-shaded': grpc_version,
    'com.google.protobuf:protobuf-java': protobuf_version,
    'com.google.api.grpc:proto-google-common-protos': '2.22.0',
    'io.perfmark:perfmark-api': '0.26.0'
]


neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
            gameDirectory = file('runs/client')
        }
        server {
            server()
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}
dependencies {
    // Guava、failureaccess 和 Gson 由 Minecraft 提供，不重复嵌入
    rpcLibraries.each { coordinate, libraryVersion ->
        jarJar("${coordinate}:${libraryVersion}") {
            version { strictly "[${libraryVersion}]" }
        }
        additionalRuntimeClasspath("${coordinate}:${libraryVersion}") {
            transitive = false
        }
    }
}
var metadataProperties = [
    mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
    mod_license: mod_license, minecraft_version_range: minecraft_version_range,
    neoforge_version: neoforge_version
]
tasks.named('processResources', ProcessResources) {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}
